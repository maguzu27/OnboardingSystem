<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f7; }
        .card { background: white; padding: 30px; border-radius: 8px; width: 320px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="email"] { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        a { display: block; margin-top: 15px; text-align: center; color: #7f8c8d; font-size: 13px; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Reset Password</h2>
    <p style="font-size: 13px; color: #555;">Enter your registered email address to receive a password reset link.</p>
    <form action="/forgot-password" method="POST">
        <input type="email" name="email" placeholder="Enter your email" required>
        <button type="submit">Send Reset Link</button>
    </form>
    <a href="/login">← Back to Login</a>
</div>

</body>
</html>
